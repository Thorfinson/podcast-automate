name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Only tests run here, never a deployment, so a superseded run of the same ref is safe to cancel.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    # Seconds, not minutes: a style or syntax slip fails here before the test legs report.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Lint Python (Ruff, the version pinned in pyproject.toml's dev extra)
        run: |
          ruff=$(python -c "import tomllib; print(next(d for d in tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['dev'] if d.startswith('ruff')))")
          python -m pip install "$ruff"
          ruff check --output-format=github .
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check the browser script's syntax
        run: node --check src/podcast_automate/web/app.js

  changes:
    # Whether the change touches a file a test can read; docs, the project page, evals and the issue and pull request
    # templates cannot break a test, so a change of only those skips the test legs (scripts/ci_changes.py, D-205).
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_changes.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  tests:
    # One runner: Linux with Python 3.13, the Python suite in three shards of about equal time (scripts/test_shards.py).
    # Every system and Python version runs on a release and in its dry run by hand, against the built wheel
    # (release.yml, D-209). The browser suite runs in shard 1.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: tests (ubuntu-latest, 3.13, ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install .
      - uses: actions/setup-node@v7
        if: matrix.shard == 1
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check Unix launchers
        if: matrix.shard == 1
        run: |
          sh -n Podcast-Studio.sh
          sh -n Podcast-Studio.command
          sh -n scripts/setup.sh
      - name: Test without model accounts or GPU (shard ${{ matrix.shard }} of 3)
        run: python scripts/test_shards.py --run ${{ matrix.shard }} 3
      - name: Test browser logic
        if: matrix.shard == 1
        run: node --test tests/studio_ui.test.cjs

  tests-passed:
    # The one check the ruleset on main requires besides lint: every shard of every leg passed, or no file a test can
    # read changed and the legs were skipped on purpose.
    name: tests passed
    needs: [lint, changes, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every leg passed, or none was needed
        env:
          LINT: ${{ needs.lint.result }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "lint: $LINT, changes: $CHANGES (code: $CODE), tests: $TESTS"
          [ "$LINT" = success ] && [ "$CHANGES" = success ] || exit 1
          if [ "$CODE" = true ]; then [ "$TESTS" = success ]; else [ "$TESTS" = skipped ]; fi
