name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Only tests run here, never a deployment, so a superseded run of the same ref is safe to cancel.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    # Seconds, not minutes: a style or syntax slip fails here before the test legs report.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Lint Python (Ruff, the version pinned in pyproject.toml's dev extra)
        run: |
          ruff=$(python -c "import tomllib; print(next(d for d in tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['dev'] if d.startswith('ruff')))")
          python -m pip install "$ruff"
          ruff check --output-format=github .
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check the browser script's syntax
        run: node --check src/podcast_automate/web/app.js

  changes:
    # Whether the change touches a file a test can read; docs, the project page, evals and the issue and pull request
    # templates cannot break a test, so a change of only those skips the test legs (scripts/ci_changes.py, D-205).
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_changes.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  tests:
    # Every system and Python version, the Python suite split into shards of about equal time (scripts/test_shards.py):
    # three on Linux and Windows, two on macOS, whose hosted runners are scarce (2026-11-10: jobs waited 15 minutes for
    # one and were cancelled) and allow five at once on this plan. The browser suite runs once per leg, in shard 1.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: tests (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.shard }}/${{ matrix.os == 'macos-latest' && 2 || 3 }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
        shard: [1, 2, 3]
        exclude:
          - os: macos-latest
            shard: 3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - uses: actions/setup-node@v7
        if: matrix.shard == 1
        with:
          node-version: "22"
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/setup-ffmpeg.ps1
          "${{ github.workspace }}\tools\ffmpeg\bin" >> $env:GITHUB_PATH
      - name: Check Unix launchers
        if: runner.os != 'Windows' && matrix.shard == 1
        run: |
          sh -n Podcast-Studio.sh
          sh -n Podcast-Studio.command
          sh -n scripts/setup.sh
      - name: Test without model accounts or GPU (shard ${{ matrix.shard }})
        run: python scripts/test_shards.py --run ${{ matrix.shard }} ${{ matrix.os == 'macos-latest' && 2 || 3 }}
      - name: Test browser logic
        if: matrix.shard == 1
        run: node --test tests/studio_ui.test.cjs

  tests-passed:
    # The one check the ruleset on main requires besides lint: every shard of every leg passed, or no file a test can
    # read changed and the legs were skipped on purpose.
    name: tests passed
    needs: [lint, changes, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every leg passed, or none was needed
        env:
          LINT: ${{ needs.lint.result }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "lint: $LINT, changes: $CHANGES (code: $CODE), tests: $TESTS"
          [ "$LINT" = success ] && [ "$CHANGES" = success ] || exit 1
          if [ "$CODE" = true ]; then [ "$TESTS" = success ]; else [ "$TESTS" = skipped ]; fi
