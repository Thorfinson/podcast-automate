name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Only tests run here, never a deployment, so a superseded run of the same ref is safe to cancel.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    # Seconds, not minutes: a style or syntax slip fails here before the six test legs report.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Lint Python (Ruff, the version pinned in pyproject.toml's dev extra)
        run: |
          python -m pip install "ruff==0.14.4"
          ruff check --output-format=github .
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check the browser script's syntax
        run: node --check src/podcast_automate/web/app.js
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/setup-ffmpeg.ps1
          "${{ github.workspace }}\tools\ffmpeg\bin" >> $env:GITHUB_PATH
      - name: Check Unix launchers
        if: runner.os != 'Windows'
        run: |
          sh -n Podcast-Studio.sh
          sh -n Podcast-Studio.command
          sh -n scripts/setup.sh
      - name: Test without model accounts or GPU
        run: python -m unittest discover -s tests -v
      - name: Test browser logic
        run: node --test tests/studio_ui.test.cjs
