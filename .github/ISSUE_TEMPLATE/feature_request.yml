name: Feature request
description: Suggest a new capability or a change to how something works.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. Some things are out of scope on purpose, for example quizzes, flashcards or automatic publishing; see [Out of scope](https://github.com/Thorfinson/podcast-automate/blob/main/docs/PRODUCT.md#out-of-scope) and the [Roadmap](https://github.com/Thorfinson/podcast-automate/blob/main/docs/PRODUCT.md#roadmap). For a bigger change, please agree on the approach here before you open a pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? How would it look in the Studio or on the command line?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Research
        - Table of contents and series plan
        - Scripts and reviews
        - Recording and audio
        - Studio
        - Text or speech providers
        - Costs, budgets and limits
        - pla command line
        - Installation and platforms
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to reach the goal, including what you do today.
  - type: textarea
    id: costs
    attributes:
      label: Effect on model calls and costs
      description: Would it add model calls, searches or speech requests per episode or series? A rough idea is enough.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
          required: false
