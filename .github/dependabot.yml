# Weekly update pull requests for the workflows' actions and the package's Python dependencies. They run the same CI
# as every pull request; a major version waits for a maintainer's read of its changelog (CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5
    # The local Qwen environment (requirements-tts*.txt) is pinned to what qwen-tts 0.1.1 and AMD's ROCm build support
    # (docs/OPERATIONS.md, "Pinned versions"); a change there needs a listening test on a GPU, so no weekly updates.
    # A new qwen-tts release still opens a pull request: that is when the pins are tried again (docs/SECURITY.md,
    # "Local Qwen's pinned packages", D-202).
    ignore:
      - dependency-name: "torch*"
      - dependency-name: transformers
      - dependency-name: accelerate
      - dependency-name: huggingface-hub
      - dependency-name: gradio
