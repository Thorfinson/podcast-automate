<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dein lokaler Arbeitsraum für recherchierte Podcasts: Idee, Inhaltsverzeichnis, Skript und Audio.">
  <title>Podcast Studio</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Zum Arbeitsbereich</a>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Podcast Studio Startseite"><span class="brand-mark">p<span>●</span></span><span>podcast<br><strong>studio</strong></span></a>
    <nav id="steps" aria-label="Arbeitsschritte"></nav>
    <div class="sidebar-bottom"><span><span class="live-dot"></span>Lokal auf diesem Computer</span><button class="quiet small" data-action="quit">Studio beenden</button></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="project-switch">
        <button id="project-overview" class="quiet small">Übersicht</button>
        <label class="sr-only" for="project-select">Projekt auswählen</label>
        <select id="project-select"><option value="">Neues Projekt</option></select>
        <button id="new-project" class="quiet small" aria-label="Neues Projekt anlegen">＋ Neu</button>
        <h2 id="project-title" class="sr-only">Neues Podcast-Projekt</h2>
      </div>
      <div id="job-bar" class="job-bar" role="status" aria-live="polite" hidden></div>
    </header>
    <main id="main" tabindex="-1">
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <div id="content"><p>Studio wird geladen …</p></div>
    </main>
    <section id="sample-playback" class="sample-playback" aria-label="Hörprobe" hidden>
      <strong id="sample-playing-label" aria-live="polite"></strong>
      <audio id="sample-player" controls preload="none"></audio>
    </section>
    <section id="job-status" class="drawer" aria-label="Maschinenraum" hidden></section>
  </div>
</body>
</html>
